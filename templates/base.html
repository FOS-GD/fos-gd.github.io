<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.url != "index.html" %}{{ page.title }} · {% endif %}{{ site.site_name }}</title>
  {% if page.meta.description or site.site_description %}
  <meta name="description" content="{{ page.meta.description or site.site_description }}">
  {% endif %}
  <link rel="icon" type="image/png" href="{{ root }}static/img/logo_fosGD_dark.png" media="(prefers-color-scheme: light)">
  <link rel="icon" type="image/png" href="{{ root }}static/img/logo_fosGD_light.png" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="{{ root }}static/vendor/nes.css/nes.min.css">
  <link rel="stylesheet" href="{{ root }}static/style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="site-name" href="{{ root }}index.html">{{ site.site_name }}</a>
      <nav>
        {% for item in nav %}
        <a href="{{ root }}{{ item.url }}"{% if item.url == current %} aria-current="page"{% endif %}>{{ item.title }}</a>
        {% endfor %}
      </nav>
    </div>
  </header>

  {% if page.url == "index.html" %}
  <section class="hero wrap">
    <picture>
      <source srcset="{{ root }}static/img/logo_fosGD_light.png" media="(prefers-color-scheme: dark)">
      <img class="hero-logo" src="{{ root }}static/img/logo_fosGD_dark.png" alt="FOS-GD logo" width="280" height="280">
    </picture>
  </section>
  {% endif %}

  <main class="wrap">
    <article class="window">
      {{ content }}
    </article>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>Built from Markdown · Styled with <a href="https://nostalgic-css.github.io/NES.css/">NES.css</a> · Analytics by <a href="https://www.goatcounter.com/">Goat Counter</a> · <a href="https://github.com/FOS-GD/fos-gd.github.io">Source</a></p>
    </div>
  </footer>

  <script data-goatcounter="https://fos-gd.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>

  <script>
    // NES.css uses an "is-dark" class for dark variants; follow the system color scheme.
    (function () {
      var dark = window.matchMedia("(prefers-color-scheme: dark)");
      function apply() {
        document.querySelectorAll(".nes-container, .nes-table").forEach(function (el) {
          el.classList.toggle("is-dark", dark.matches);
        });
      }
      apply();
      dark.addEventListener("change", apply);
    })();
  </script>
</body>
</html>
